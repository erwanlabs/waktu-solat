9-07-11|0543|0553|0704|1307|1631|1906|2020","1449-07-12|0543|0553|0705|1308|1631|1906|2021","1449-07-13|0543|0553|0705|1308|1632|1906|2021","1449-07-14|0544|0554|0706|1309|1632|1907|2022","1449-07-15|0544|0554|0706|1309|1633|1907|2022","1449-07-16|0545|0555|0707|1310|1633|1908|2023","1449-07-17|0545|0555|0707|1310|1634|1908|2023","1449-07-18|0546|0556|0708|1311|1634|1909|2024","1449-07-19|0546|0556|0708|1311|1635|1909|2024","1449-07-20|0547|0557|0709|1312|1635|1910|2025","1449-07-21|0547|0557|0709|1312|1636|1910|2025","1449-07-22|0548|0558|0710|1313|1636|1911|2026","1449-07-23|0548|0558|0710|1313|1637|1911|2026","1449-07-24|0549|0559|0711|1314|1637|1912|2027","1449-07-25|0549|0559|0711|1314|1638|1912|2027","1449-07-26|0550|0600|0712|1315|1638|1913|2028","1449-07-27|0550|0600|0712|1315|1639|1913|2028","1449-07-28|0551|0601|0713|1316|1639|1914|2029","1449-07-29|0551|0601|0713|1316|1640|1914|2029","1449-08-01|0552|0602|0714|1317|1640|1915|2030","1449-08-02|0552|0602|0714|1317|1641|1915|2030","1449-08-03|0553|0603|0715|1317|1641|1916|2030"];

var HARI = ["Ahad", "Isnin", "Selasa", "Rabu", "Khamis", "Jumaat", "Sabtu"];
var BULAN = ["Januari", "Februari", "Mac", "April", "Mei", "Jun", "Julai", "Ogos", "September", "Oktober", "November", "Disember"];
var BULAN_HIJRI = ["Muharram", "Safar", "Rabiulawal", "Rabiulakhir", "Jamadilawal", "Jamadilakhir", "Rejab", "Syaaban", "Ramadan", "Syawal", "Zulkaedah", "Zulhijjah"];
var NAMA_WAKTU = ["SUBUH", "SYURUK", "ZOHOR", "ASAR", "MAGHRIB", "ISYAK"];

function $(id) { return document.getElementById(id); }
function pad(n) { return n < 10 ? "0" + n : "" + n; }

// Mulakan semula animasi CSS pada elemen (buang kelas, paksa reflow, pasang semula)
function ulangAnimasi(el, kelas) {
  el.classList.remove(kelas);
  void el.offsetWidth;
  el.classList.add(kelas);
}

// Bina slot digit ikut pola, cth "00:00:00". Setiap "0" jadi satu slot lebar tetap.
function binaDigit(el, pola) {
  var slot = [];
  el.innerHTML = "";
  for (var i = 0; i < pola.length; i++) {
    var s = document.createElement("span");
    if (pola.charAt(i) === "0") { s.className = "d"; slot.push(s); }
    else { s.className = "tk"; s.textContent = pola.charAt(i); }
    el.appendChild(s);
  }
  el.slotDigit = slot;
}

// Tukar digit; hanya slot yang berubah akan "bergulung" masuk. Ruang " " = slot disembunyikan.
function setDigit(el, teks, animasi) {
  for (var i = 0; i < el.slotDigit.length; i++) {
    var s = el.slotDigit[i], c = teks.charAt(i);
    if (s.textContent === c) continue;
    s.textContent = c;
    if (c === " ") { s.classList.add("kosong"); continue; }
    s.classList.remove("kosong");
    if (animasi) ulangAnimasi(s, "gulung");
  }
}

function indeksHari(d) {
  return Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - DATA_MULA) / 86400000);
}

// Pulangkan {hijri, waktu:[minit subuh..isyak]} atau null jika di luar julat data
function dataHari(d) {
  var i = indeksHari(d);
  if (i < 0 || i >= DATA.length) return null;
  var p = DATA[i].split("|");
  var w = [];
  for (var j = 2; j < 8; j++) {
    w.push(parseInt(p[j].substr(0, 2), 10) * 60 + parseInt(p[j].substr(2, 2), 10));
  }
  return { hijri: p[0], waktu: w };
}

function formatWaktu(minit) {
  var h = Math.floor(minit / 60), m = minit % 60;
  if (!FORMAT_24JAM) h = h % 12 || 12;
  return h + ":" + pad(m);
}

function formatHijri(s) {
  var p = s.split("-");
  return parseInt(p[2], 10) + " " + BULAN_HIJRI[parseInt(p[1], 10) - 1] + " " + p[0] + "H";
}

function formatKira(saat) {
  var h = Math.floor(saat / 3600), m = Math.floor((saat % 3600) / 60), s = saat % 60;
  return pad(h) + pad(m) + pad(s);
}

function labelAmPm(h) {
  if (h < 12) return "PG";
  if (h < 14) return "TGH";
  if (h < 19) return "PTG";
  return "MLM";
}

var kotak = [], tarikhLepas = "", kiniLepas = -1, nextLepas = -1, modLepas = "", namaNextLepas = "";
var ampmLepas = "", tutupLapis = null, mulaJalan = false;

function bukaLapis(mod) {
  var lapis = $("lapis");
  clearTimeout(tutupLapis);
  if (mod) {
    lapis.className = mod === "jumaat" ? "solat" : mod;
    lapis.style.display = "flex";
    if (lapis.style.display !== "flex") lapis.style.display = "-webkit-flex";  // pelayar lama
    void lapis.offsetWidth;
    lapis.classList.add("buka");
  } else {
    lapis.classList.remove("buka");
    tutupLapis = setTimeout(function () { lapis.style.display = "none"; }, 750);
  }
}

// Tentukan lapisan yang patut dipapar: "" (tiada), "iqamah", "solat" atau "jumaat"
function kemasLapis(now, hari, kini, saatKini) {
  var mod = "", tajuk = "", kecil = "", teks = "", baki = 0, jumlah = 1;
  var lalu = saatKini - hari.waktu[kini] * 60;   // negatif sebelum Subuh (kini = Isyak semalam)
  var nama = NAMA_WAKTU[kini];
  if (kini !== 1 && lalu >= 0) {
    if (kini === 2 && now.getDay() === 5) {
      if (lalu < JUMAAT_MINIT * 60) {
        mod = "jumaat"; tajuk = "SOLAT JUMAAT";
        kecil = "Dengar khutbah dengan tenang"; teks = "Sila matikan<br>telefon bimbit";
      }
    } else if (lalu < IQAMAH_MINIT[kini] * 60) {
      mod = "iqamah"; tajuk = "WAKTU " + nama + " TELAH MASUK"; kecil = "Iqamah dalam";
      jumlah = IQAMAH_MINIT[kini] * 60; baki = jumlah - lalu;
    } else if (lalu < (IQAMAH_MINIT[kini] + SOLAT_MINIT) * 60) {
      mod = "solat"; tajuk = "SOLAT " + nama;
      kecil = "Luruskan dan rapatkan saf"; teks = "Sila matikan<br>telefon bimbit";
    }
  }
  if (mod !== modLepas) {
    $("lapisTajuk").innerHTML = tajuk;
    $("lapisKecil").innerHTML = kecil;
    $("lapisTeks").innerHTML = teks || "&nbsp;";
    bukaLapis(mod);
    modLepas = mod;
  }
  if (mod === "iqamah") {
    var m = Math.floor(baki / 60), s = baki % 60;
    setDigit($("lapisKira"), pad(m) + pad(s), true);
    $("lapisBarIsi").style.transform = "scaleX(" + (baki / jumlah) + ")";
    var lapis = $("lapis");
    if (baki <= 10) lapis.classList.add("akhir"); else lapis.classList.remove("akhir");
  }
}

function pasangHari(now, hari) {
  $("masihi").innerHTML = HARI[now.getDay()] + ", " + now.getDate() + " " + BULAN[now.getMonth()] + " " + now.getFullYear();
  $("hijri").innerHTML = formatHijri(hari.hijri);
  var jumaat = now.getDay() === 5;
  for (var i = 0; i < 6; i++) {
    kotak[i].n.innerHTML = (i === 2 && jumaat) ? "JUMAAT" : NAMA_WAKTU[i];
    kotak[i].t.innerHTML = formatWaktu(hari.waktu[i]);
  }
}

function tandaKotak(kini, next) {
  for (var i = 0; i < 6; i++) {
    kotak[i].el.className = "kotak" + (i === kini ? " kini" : "") + (i === next ? " next" : "");
  }
}

function kemasJam(now, animasi) {
  var h = now.getHours();
  var jj = FORMAT_24JAM ? pad(h) : String(h % 12 || 12);
  if (jj.length === 1) jj = " " + jj;  // jam 1-9: slot pertama disembunyikan
  setDigit($("jamH"), jj, animasi);
  setDigit($("jamM"), pad(now.getMinutes()), animasi);
  setDigit($("jamS"), pad(now.getSeconds()), animasi);
  var ap = FORMAT_24JAM ? "" : labelAmPm(h);
  if (ap !== ampmLepas) { $("ampm").innerHTML = ap; ampmLepas = ap; }
}

function tick() {
  var now = new Date();
  var hari = dataHari(now);
  var animasi = mulaJalan && !RINGAN;  // tiada animasi digit pada saat pertama & dalam mod ringan

  if (!hari) {
    $("tamat").style.display = "block";
    $("seterusnya").style.visibility = "hidden";
    $("maju").style.visibility = "hidden";
  } else {
    var kunci = now.getFullYear() + "-" + now.getMonth() + "-" + now.getDate();
    if (kunci !== tarikhLepas) {
      pasangHari(now, hari);
      tarikhLepas = kunci;
      kiniLepas = -1; nextLepas = -1;
    }

    var saatKini = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
    var kini = 5, adaLalu = false, next = -1, sasaran = 0;  // sebelum Subuh, waktu semasa masih Isyak
    for (var i = 0; i < 6; i++) {
      var s = hari.waktu[i] * 60;
      if (s <= saatKini) { kini = i; adaLalu = true; }
      else if (next === -1) { next = i; sasaran = s; }
    }

    // Titik mula tempoh semasa, untuk bar kemajuan
    var semalam = dataHari(new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1));
    var mulaS = adaLalu ? hari.waktu[kini] * 60 : ((semalam ? semalam.waktu[5] : hari.waktu[5]) * 60 - 86400);

    var namaNext;
    if (next === -1) {
      // Selepas Isyak: kira ke Subuh esok
      var hariEsok = dataHari(new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1));
      namaNext = "SUBUH";
      sasaran = hariEsok ? 86400 + hariEsok.waktu[0] * 60 : -1;
    } else {
      namaNext = (next === 2 && now.getDay() === 5) ? "JUMAAT" : NAMA_WAKTU[next];
    }

    if (kini !== kiniLepas || next !== nextLepas) {
      tandaKotak(kini, next === -1 ? 0 : next);  // selepas Isyak, tanda Subuh esok
      kiniLepas = kini; nextLepas = next;
    }
    kemasLapis(now, hari, kini, saatKini);

    if (sasaran >= 0) {
      if (namaNext !== namaNextLepas) {
        $("namaNext").innerHTML = namaNext;
        if (animasi) ulangAnimasi($("namaNext"), "gulung");
        namaNextLepas = namaNext;
      }
      setDigit($("kira"), formatKira(sasaran - saatKini), animasi);
      var maju = (saatKini - mulaS) / (sasaran - mulaS);
      $("majuIsi").style.transform = "scaleX(" + Math.max(0, Math.min(1, maju)).toFixed(4) + ")";
      $("seterusnya").style.visibility = "visible";
      $("maju").style.visibility = "visible";
    } else {
      $("seterusnya").style.visibility = "hidden";
      $("maju").style.visibility = "hidden";
    }
  }

  kemasJam(now, animasi);
  mulaJalan = true;

  // Jadualkan tepat pada saat seterusnya supaya jam tak "melompat"
  setTimeout(tick, 1000 - new Date().getMilliseconds() + 20);
}

function pilihRingan() {
  var q = location.search.match(/mod=(ringan|penuh)/);
  var mod = q ? q[1] : MOD;
  if (mod !== "auto") return mod === "ringan";
  var ios = navigator.userAgent.match(/OS (\d+)_\d+(_\d+)? like Mac OS X/);
  return !!(ios && parseInt(ios[1], 10) < 13);
}
var RINGAN = pilihRingan();

function mula() {
  for (var i = 0; i < 6; i++) {
    var el = $("k" + i);
    kotak.push({ el: el, n: el.children[0], t: el.children[1] });
  }
  binaDigit($("jamH"), "00");
  binaDigit($("jamM"), "00");
  binaDigit($("jamS"), "00");
  binaDigit($("kira"), "00:00:00");
  binaDigit($("lapisKira"), "00:00");
  if (!ANIMASI_LATAR) document.body.classList.add("tenang");
  if (RINGAN) document.body.classList.add("ringan");
  $("nama").innerHTML = NAMA;
  $("julat").innerHTML = "Data sah hingga 31 Disember 2027";
  tick();
}

mula();
</script>
